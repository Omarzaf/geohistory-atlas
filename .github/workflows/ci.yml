name: Geohistory Regional CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

jobs:
  validate:
    name: Build and validate regional atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build explicit public surface
        run: node scripts/build-region.cjs
      - name: Verify chronology, provenance, geometry and release surface
        run: node scripts/verify-region.mjs
